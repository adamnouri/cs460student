<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torus World · CS460 / 03</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.180.0/examples/jsm/"}}
  </script>
</head>
<body>
  <header><span class="eyebrow">CS460 / EXPERIMENT 03</span><h1>Torus<span>world.</span></h1><p>A little chaos. A lot of pink.</p></header>
  <main id="stage" aria-label="Interactive three-dimensional torus world"></main>
  <aside aria-label="Scene controls">
    <div class="eyebrow">MAKE SOMETHING STRANGE</div>
    <p><kbd>Shift</kbd> + drag to plant &amp; scale.<br>Drag up to grow; down through zero to turn green.</p>
    <p class="muted">Drag to orbit · Scroll to zoom · Right-drag to pan</p>
    <div class="actions">
      <button id="flicker" aria-pressed="false"><kbd>F</kbd> Flicker</button>
      <button id="wireframe" aria-pressed="false"><kbd>W</kbd> Wireframe</button>
    </div>
    <div class="actions secondary">
      <button id="compose">Flower cluster</button><button id="reset">Reset view</button><button id="clear">Clear</button>
    </div>
    <button id="capture">Save PNG ↓</button>
    <p id="stats" aria-live="polite"></p>
    <p id="status" role="status">Loading the world…</p>
  </aside>
  <footer><span class="dot pink"></span> HOT PINK <span class="dot green"></span> GRASS GREEN <span class="footer-right">SHIFT. DRAG. FLIP.</span></footer>
  <script type="module" src="app.js"></script>
</body>
</html>

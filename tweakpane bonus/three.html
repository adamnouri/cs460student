<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS460 - Three.js + Tweakpane</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #badge {
      position: absolute;
      top: 14px;
      left: 14px;
      color: #e6edf3;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      z-index: 10;
      pointer-events: none;
    }
    #badge strong {
      color: #f43f5e;
    }
    #nav {
      position: absolute;
      bottom: 14px;
      left: 14px;
      z-index: 10;
    }
    #nav a {
      display: inline-block;
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    #nav a:hover {
      color: #fff;
      border-color: #f43f5e;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js"
      }
    }
  </script>
</head>
<body>

  <div id="badge">
    <strong>CS460</strong> · Three.js Implementation + Tweakpane
  </div>

  <div id="nav">
    <a href="xtk.html">← Switch to XTK Implementation</a>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Pane } from 'tweakpane';

    // 1. Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0b0e14');

    // 2. Camera setup
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(20, 20, 30);

    // 3. Renderer setup
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // 4. Orbit Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 5. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(25, 40, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // Grid Floor
    const grid = new THREE.GridHelper(50, 50, 0x334155, 0x1e293b);
    grid.position.y = -10;
    scene.add(grid);

    // 6. Primary Mesh
    const geometry = new THREE.BoxGeometry(15, 15, 15);
    const material = new THREE.MeshStandardMaterial({
      color: 0xf43f5e,
      roughness: 0.35,
      metalness: 0.25,
      transparent: true,
      opacity: 1.0,
      wireframe: false,
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    // 7. Tweakpane Setup
    const pane = new Pane({
      title: 'Three.js Scene Controls'
    });

    const PARAMS = {
      color: '#f43f5e',
      bgColor: '#0b0e14',
      autoRotate: false,
      rotationSpeed: 0.015,
      lightIntensity: 1.2,
    };

    // --- Material Folder ---
    const fMat = pane.addFolder({ title: 'Material & Colors' });

    fMat.addBinding(PARAMS, 'color', { label: 'Mesh Color' }).on('change', (ev) => {
      material.color.set(ev.value);
    });

    fMat.addBinding(material, 'roughness', { min: 0.0, max: 1.0, step: 0.02 });
    fMat.addBinding(material, 'metalness', { min: 0.0, max: 1.0, step: 0.02 });
    fMat.addBinding(material, 'opacity', { min: 0.05, max: 1.0, step: 0.05 });
    fMat.addBinding(material, 'wireframe');
    fMat.addBinding(mesh, 'visible');

    // --- Transform Folder ---
    const fTrans = pane.addFolder({ title: 'Transformations' });

    fTrans.addBinding(mesh.rotation, 'x', { min: -Math.PI, max: Math.PI, step: 0.02, label: 'Rotate X' });
    fTrans.addBinding(mesh.rotation, 'y', { min: -Math.PI, max: Math.PI, step: 0.02, label: 'Rotate Y' });
    fTrans.addBinding(mesh.rotation, 'z', { min: -Math.PI, max: Math.PI, step: 0.02, label: 'Rotate Z' });

    fTrans.addBinding(mesh.position, 'y', { min: -10, max: 20, step: 0.5, label: 'Position Y' });
    fTrans.addBinding(mesh.scale, 'x', { min: 0.2, max: 3.0, step: 0.1, label: 'Scale' }).on('change', (ev) => {
      mesh.scale.set(ev.value, ev.value, ev.value);
    });

    // --- Lighting & Environment Folder ---
    const fEnv = pane.addFolder({ title: 'Environment & Light' });

    fEnv.addBinding(PARAMS, 'lightIntensity', { min: 0.0, max: 3.0, step: 0.1, label: 'Sun Light' }).on('change', (ev) => {
      dirLight.intensity = ev.value;
    });
    fEnv.addBinding(ambientLight, 'intensity', { min: 0.0, max: 2.0, step: 0.05, label: 'Ambient' });
    fEnv.addBinding(PARAMS, 'bgColor', { label: 'Background' }).on('change', (ev) => {
      scene.background.set(ev.value);
    });
    fEnv.addBinding(grid, 'visible', { label: 'Show Grid' });

    // --- Animation Folder ---
    const fAnim = pane.addFolder({ title: 'Animation' });
    fAnim.addBinding(PARAMS, 'autoRotate', { label: 'Auto Spin' });
    fAnim.addBinding(PARAMS, 'rotationSpeed', { min: 0.002, max: 0.08, step: 0.002, label: 'Speed' });

    // Reset button
    pane.addButton({ title: 'Reset View & Model' }).on('click', () => {
      mesh.rotation.set(0, 0, 0);
      mesh.position.set(0, 0, 0);
      mesh.scale.set(1, 1, 1);
      camera.position.set(20, 20, 30);
      controls.target.set(0, 0, 0);
      controls.update();
      pane.refresh();
    });

    // Responsive window resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      if (PARAMS.autoRotate) {
        mesh.rotation.y += PARAMS.rotationSpeed;
        mesh.rotation.x += PARAMS.rotationSpeed * 0.5;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
